# Alerts on the BMCs, from each site's exporter, and on a rollout, from the runs' pushes. Rollout alerts only for
# pipelines pushed in the last hour: the Pushgateway keeps a run's last metrics until it restarts.
groups:
  - name: bmc
    rules:
      - alert: BMCDown
        # Not while a rollout is updating the host: the reset after the flash takes its BMC away for minutes
        expr: >-
          redfish_up == 0
          unless on (host) (rollout_host_info{state="running"}
                            and on (pipeline) max by (pipeline) (time() - push_time_seconds) < 3600)
        for: 10m
        labels: {severity: page}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.site }}) has not answered Redfish for 10 minutes"}
      - alert: BMCLoginRefused
        expr: redfish_login_refused == 1
        labels: {severity: ticket}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.site }}) refused the login: the exporter stopped
          asking so the account doesn't lock. Fix the credentials, then restart the exporter."}
      - alert: ReadingPastCritical
        # At or past a critical or fatal threshold, upper or lower: a hot sensor, a fan slowing below its limit
        expr: redfish_reading and on (site, host, resource, property) (redfish_reading_crossed >= 2)
        for: 2m
        labels: {severity: page}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.site }}): {{ $labels.sensor }} {{ $labels.property }}
          at {{ $value }} {{ $labels.unit }}, at or past its critical threshold"}
      - alert: HealthCritical
        expr: redfish_health == 2
        for: 5m
        labels: {severity: page}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.site }}): {{ $labels.name }} is Critical
          ({{ $labels.resource }})"}
      - alert: HealthWarning
        expr: redfish_health == 1
        for: 30m
        labels: {severity: ticket}
        annotations: {summary: "{{ $labels.host }} ({{ $labels.site }}): {{ $labels.name }} is Warning
          ({{ $labels.resource }})"}
  - name: rollout
    rules:
      - alert: RolloutHalted
        expr: >-
          max by (site, pipeline, wave) (rollout_gate_halted) == 1
          and on (pipeline) max by (pipeline) (time() - push_time_seconds) < 3600
        labels: {severity: page}
        annotations: {summary: "Rollout {{ $labels.pipeline }} ({{ $labels.site }}) halted after {{ $labels.wave }}"}
      - alert: HostNeedsAPerson
        expr: >-
          max by (site, pipeline, host, state) (rollout_host_info{state=~"failed|needs_attention|incomplete"})
          and on (pipeline) max by (pipeline) (time() - push_time_seconds) < 3600
        labels: {severity: page}
        annotations: {summary: "{{ $labels.host }} ended {{ $labels.state }} in {{ $labels.pipeline }}
          ({{ $labels.site }})"}
