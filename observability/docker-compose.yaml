#   exporter-lab   poller.py 
#   exporter-prod  poller.py 
#   pushgateway    where rollout.py run pushes each run's metrics
#   prometheus     scrapes them                                       
#   loki           where rollout.py run sends every event of its run record 
#   grafana        
name: redfish-observability
x-exporter: &exporter
  build: {context: .., dockerfile: observability/Dockerfile}
  image: redfish/exporter
  restart: unless-stopped
  network_mode: host
  volumes: ["..:/app:ro", "../schemas:/app/schemas"]  # the repo read-only; the DMTF schemas cache shared with it
services:
  exporter-lab:
    <<: *exporter
    command: [--listen, "127.0.0.1:9101", --interval, "10"]
    environment: [SITE=lab, LAB_USERNAME=root, LAB_PASSWORD=0penBmc]  # default credentials
  exporter-prod:
    <<: *exporter
    command: [--listen, "127.0.0.1:9102", --interval, "30"]
    environment: [SITE=prod]
    env_file: [{path: ../prod/.env, required: false}]
  pushgateway:
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    network_mode: host
    command: [--web.listen-address=127.0.0.1:9091]
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    network_mode: host
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus,
              --web.listen-address=127.0.0.1:9090]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    network_mode: host
    command: [-config.file=/etc/loki/loki.yaml]
    volumes: ["./loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki:/loki"]
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./grafana/.grafana.env
    volumes: ["./grafana/grafana.ini:/etc/grafana/grafana.ini:ro", 
              "./grafana/provisioning:/etc/grafana/provisioning:ro",
              "./grafana/dashboards:/etc/grafana/dashboards:ro", 
              "grafana:/var/lib/grafana"]
volumes:
  prometheus:
  loki:
  grafana:
