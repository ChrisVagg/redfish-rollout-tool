# Prometheus for both sites: each site's exporter (BMC telemetry, labelled with its site) and the Pushgateway, where
# rollout.py run pushes each run's metrics (PUSHGATEWAY)
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: redfish
    static_configs:
      - {targets: ["127.0.0.1:9101"], labels: {site: lab}}
      - {targets: ["127.0.0.1:9102"], labels: {site: prod}}
  - job_name: pushgateway
    scrape_interval: 5s
    honor_labels: true  # keep the site, pipeline, stage and host labels the runs pushed
    static_configs: [{targets: ["127.0.0.1:9091"]}]
