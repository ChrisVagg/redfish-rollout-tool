# NetBox, the inventory's source of truth, on http://127.0.0.1:8000: the lab's hosts, their racks, projects and BMC
# addresses. make netbox-up starts it and loads lab/inventory.yaml's servers into an empty NetBox (seed.py). The
# secrets are random, made once by make into netbox/.netbox.env (git-ignored): the admin's password is
# SUPERUSER_PASSWORD there; the tools read as the account redfish, which may only view devices, with NETBOX_TOKEN,
# its read-only API token.
name: redfish-netbox
x-secrets: &secrets
  env_file: .netbox.env
services:
  netbox:
    image: netboxcommunity/netbox:v4.7.2-5.1.1
    <<: *secrets
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    user: "netbox:root"
    ports: ["127.0.0.1:8000:8080"]
    # GRANIAN_EXTRA_ARGS: the web server on IPv4, after the image's --host ::, which fails where Docker has no IPv6
    environment: [DB_HOST=postgres, DB_NAME=netbox, DB_USER=netbox, REDIS_HOST=redis, SKIP_SUPERUSER=false,
                  SUPERUSER_NAME=admin, GRANIAN_EXTRA_ARGS=--host=0.0.0.0]
    healthcheck: {test: /opt/netbox/health.sh, start_period: 600s, timeout: 3s, interval: 5s}  # the first start migrates
    volumes: ["../lab/inventory.yaml:/seed/lab/inventory.yaml:ro"]  # what seed.py loads
  postgres:
    image: postgres:18-alpine
    <<: *secrets
    restart: unless-stopped
    environment: [POSTGRES_DB=netbox, POSTGRES_USER=netbox]
    healthcheck: {test: pg_isready -q -d netbox -U netbox, start_period: 20s, timeout: 30s, interval: 5s}
    volumes: ["postgres:/var/lib/postgresql"]
  # NetBox's queue and cache, one Valkey: the cache in its database 1
  redis:
    image: valkey/valkey:9.1-alpine
    <<: *secrets
    restart: unless-stopped
    command: [sh, -c, valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"]
    healthcheck: {test: '[ "$$(valkey-cli --pass "$$REDIS_PASSWORD" --no-auth-warning ping)" = PONG ]', interval: 2s}
    volumes: ["redis:/data"]
volumes:
  postgres:
  redis:
