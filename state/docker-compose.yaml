# The rollout state database, PostgreSQL on 127.0.0.1:5432: every event of every run, and a lock per host; and pgAdmin
# to look at it. make state-up starts them (make lab-up does too); schema.sql makes the tables and accounts on the
# first start. Their passwords are random, made once by make into state/.state.env (git-ignored); rollout.py reads the
# redfish_rollout_sa's in STATE_DB, which make sets, and Grafana its own.
name: redfish-state
services:
  postgres:
    image: postgres:18-alpine
    env_file: .state.env
    restart: unless-stopped
    environment: [POSTGRES_DB=rollout, POSTGRES_USER=rollout]
    ports: ["127.0.0.1:5432:5432"]
    # over TCP, as rollout.py connects: the first start's schema runs on a server that listens on a socket only
    healthcheck: {test: pg_isready -q -h 127.0.0.1 -d rollout -U rollout, start_period: 20s, timeout: 30s, interval: 2s}
    volumes: ["postgres:/var/lib/postgresql", "./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
  # The retention, every hour: the events older than RETENTION_DAYS go, as Prometheus and Loki keep 15 days. The
  # locks never expire
  retention:
    image: postgres:18-alpine
    env_file: .state.env
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    environment: [PGHOST=postgres, PGUSER=rollout, PGDATABASE=rollout, RETENTION_DAYS=15]
    command: [sh, -c, 'export PGPASSWORD="$$POSTGRES_PASSWORD"; while :; do
                echo "DELETE FROM events WHERE at < now() - make_interval(days => :days)" | psql -v days="$$RETENTION_DAYS";
                sleep 3600; done']
  # pgAdmin on http://127.0.0.1:5050, to look at the schema and the tables. Its login: admin@example.com and
  # PGADMIN_PASSWORD from .state.env. It reads the database as viewer, which may read every table and change none. Only
  # the two passwords it needs, from make (make state-up), not the whole .state.env
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["127.0.0.1:5050:80"]
    # PGADMIN_LISTEN_ADDRESS: IPv4, not the image's ::, which fails where Docker has no IPv6
    environment: [PGADMIN_DEFAULT_EMAIL=admin@example.com, PGADMIN_DEFAULT_PASSWORD, VIEWER_PASSWORD,
                  PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False, PGADMIN_LISTEN_ADDRESS=0.0.0.0]
    # the viewer's password into a pgpass file, which the server below reads, then pgAdmin. In server mode a PassFile
    # is a path in the user's storage directory
    entrypoint: [sh, -c, 'umask 077; d=/var/lib/pgadmin/storage/admin_example.com; mkdir -p $$d;
                 printf "postgres:5432:rollout:viewer:%s\n" "$$VIEWER_PASSWORD" > $$d/pgpass; exec /entrypoint.sh']
    configs: [{source: servers, target: /pgadmin4/servers.json}]
    volumes: ["pgadmin:/var/lib/pgadmin"]
configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "Redfish state", "Group": "Servers", "Host": "postgres", "Port": 5432,
                         "MaintenanceDB": "rollout", "Username": "viewer", "PassFile": "/pgpass"}}}
volumes:
  postgres:
  pgadmin:
