# The lab: ten emulated OpenBMC GB200 NVL BMCs, one QEMU per container, each on its own flash volume
name: redfish-lab
x-bmc: &bmc
  build: .
  image: redfish-lab/openbmc-gb200nvl
  restart: unless-stopped
# Boot into batches for CPU starvation problem
x-after-batch-1: &after-batch-1
  bmc1: {condition: service_healthy}
  bmc2: {condition: service_healthy}
  bmc3: {condition: service_healthy}
  bmc4: {condition: service_healthy}
x-after-batch-2: &after-batch-2
  bmc5: {condition: service_healthy}
  bmc6: {condition: service_healthy}
  bmc7: {condition: service_healthy}
  bmc8: {condition: service_healthy}
services:
  bmc1:
    <<: *bmc
    ports: ["127.0.0.1:2441:443", "127.0.0.1:2221:22"]
    volumes: ["bmc1-flash:/flash"]
  bmc2:
    <<: *bmc
    ports: ["127.0.0.1:2442:443", "127.0.0.1:2222:22"]
    volumes: ["bmc2-flash:/flash"]
  bmc3:
    <<: *bmc
    ports: ["127.0.0.1:2443:443", "127.0.0.1:2223:22"]
    volumes: ["bmc3-flash:/flash"]
  bmc4:
    <<: *bmc
    ports: ["127.0.0.1:2444:443", "127.0.0.1:2224:22"]
    volumes: ["bmc4-flash:/flash"]
  bmc5:
    <<: *bmc
    depends_on: *after-batch-1
    ports: ["127.0.0.1:2445:443", "127.0.0.1:2225:22"]
    volumes: ["bmc5-flash:/flash"]
  bmc6:
    <<: *bmc
    depends_on: *after-batch-1
    ports: ["127.0.0.1:2446:443", "127.0.0.1:2226:22"]
    volumes: ["bmc6-flash:/flash"]
  bmc7:
    <<: *bmc
    depends_on: *after-batch-1
    ports: ["127.0.0.1:2447:443", "127.0.0.1:2227:22"]
    volumes: ["bmc7-flash:/flash"]
  bmc8:
    <<: *bmc
    depends_on: *after-batch-1
    ports: ["127.0.0.1:2448:443", "127.0.0.1:2228:22"]
    volumes: ["bmc8-flash:/flash"]
  bmc9:
    <<: *bmc
    depends_on: *after-batch-2
    ports: ["127.0.0.1:2449:443", "127.0.0.1:2229:22"]
    volumes: ["bmc9-flash:/flash"]
  bmc10:
    <<: *bmc
    depends_on: *after-batch-2
    ports: ["127.0.0.1:2450:443", "127.0.0.1:2230:22"]
    volumes: ["bmc10-flash:/flash"]
    
  # The approved store, SeaweedFS: lab/promote-fw-images.sh uploads the packages into its bucket firmware once their
  # signatures verify; it keeps the only copy, and allows reads only
  store:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/access.json]
    volumes: ["store:/data", "./store/access.json:/etc/seaweedfs/access.json:ro"]
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:8888/"]
      interval: 5s
      retries: 30
  # The site's image cache: nginx over HTTPS, caching what it fetches from the store.
  image-cache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [store]
    ports: ["127.0.0.1:8443:443"]
    volumes: ["image-cache:/var/cache/nginx", "./cache/nginx.conf:/etc/nginx/conf.d/default.conf:ro",
              "./cache/tls.crt:/etc/nginx/tls.crt:ro", "./cache/tls.key:/etc/nginx/tls.key:ro"]

volumes:
  bmc1-flash:
  bmc2-flash:
  bmc3-flash:
  bmc4-flash:
  bmc5-flash:
  bmc6-flash:
  bmc7-flash:
  bmc8-flash:
  bmc9-flash:
  bmc10-flash:
  store:
  image-cache:
