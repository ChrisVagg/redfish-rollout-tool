# The lab's image cache: a caching proxy in front of the approved store, over HTTPS. A package is fetched from the
# store once, then served from this cache.
# X-Cache-Status header says MISS (fetched from the filesystem store service) or HIT (served from the cache).
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls.crt;
    ssl_certificate_key /etc/nginx/tls.key;

    location /images/ {
        proxy_pass http://store:8333/firmware/images/;
        proxy_cache images;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location / { return 404; }
}
