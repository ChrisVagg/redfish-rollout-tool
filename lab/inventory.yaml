# The lab's inventory. The hosts come from NetBox.
netbox: {url: "http://127.0.0.1:8000", site: lab}
defaults: {verify: false, scheme: https, timeout: [5, 30], retries: 1, max_failures: 3, deadline: 300,
           username_env: LAB_USERNAME, password_env: LAB_PASSWORD, writable: true}
servers:
  - {node: bmc1, host: "127.1.0.1", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r1, canary: true}
  - {node: bmc2, host: "127.1.0.2", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r2}
  - {node: bmc3, host: "127.1.0.3", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r3}
  - {node: bmc4, host: "127.1.0.4", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r1}
