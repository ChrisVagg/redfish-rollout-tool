  - {node: bmc6, host: "127.1.0.6", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r3}
  - {node: bmc7, host: "127.1.0.7", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r1}
  - {node: bmc8, host: "127.1.0.8", vendor: NVIDIA, model: "GB200 NVL", project: lab, rack: r2}
