<svg viewBox="0 0 1100 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A production firmware-update system, the target for this rollout at fleet scale. Supply chain: vendor images are downloaded, ingested with their checksum and signature checked, tested on lab hosts of every model, and promoted into an approved store such as Artifactory or S3. Control plane: an operator requests and approves a rollout through an API and CLI; a workflow engine such as Temporal (or Argo) reads the firmware catalog of baselines and images per model and the inventory in NetBox or Nautobot, keeps its execution history in its own store, and writes each host's state, locks and audit trail to a rollout state database in PostgreSQL. Each site: a site agent takes the work of each wave, gets BMC credentials from Vault; account rotation requires a validated integration, drains and undrains hosts through a validated scheduler integration, drives updates, tasks and resets over Redfish on the BMCs, and reports inventory and health back. Each BMC contains an EventService resource whose events reach Loki through an event receiver. The receiver subscribes to EventService, receives Event payloads and forwards them to Loki; this is future work. A site image cache fetches each image from the approved store cached per site; a BMC that offers SimpleUpdate pulls it from the cache, and for a push-only BMC the agent reads it from the cache and pushes it to MultipartHttpPushUri; the BMCs manage the GPU hosts. Observability: Prometheus, Loki and Grafana are separate services. Prometheus scrapes metrics, agents push rollout events into Loki, and the event receiver forwards BMC events into Loki. Prometheus and Loki are Grafana's data sources, with separate arrows from each to Grafana. Prometheus sends alerts for halts and quarantines to Alertmanager. Numbered badges mark where each rollout stage happens: 0 ingest, 1 plan and pre-flight, 2 drain, 3 update, 4 reset, 5 post-checks, 6 undrain or roll back.">
  <style>
    .ps text { font-family: var(--mono, monospace); }
    .ps .bg { fill: var(--bg-deep, #050708); }
    .ps .box { fill: var(--surface, #0d1417); stroke: var(--line, #2a3538); }
    .ps .name { fill: var(--fg, #e6f7fa); font-size: 12.5px; font-weight: 600; }
    .ps .sub { fill: var(--dim, #6f8f97); font-size: 10px; }
    .ps .band { fill: var(--dim, #6f8f97); font-size: 9.5px; letter-spacing: .14em; }
    .ps .band.hi { fill: var(--teal, #00ffc8); }
    .ps .lbl { fill: var(--dim, #6f8f97); font-size: 10px; }
    .ps .cut { fill: none; stroke: var(--line, #2a3538); stroke-width: 1; stroke-dasharray: 5 5; }
    /* a connection in its service's colour; the hardware link is the only solid one */
    .ps .edge { fill: none; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ps .edge.g-hw { stroke-dasharray: none; }
    .ps .elabel { fill: var(--fg, #e6f7fa); font-size: 10px; paint-order: stroke; stroke: var(--bg-deep, #050708); stroke-width: 4px; stroke-linejoin: round; }
    .ps .badge circle { fill: var(--amber, #ffb454); }
    .ps .badge text { fill: var(--bg-deep, #050708); font-size: 10px; font-weight: 700; }
    .ps .g-img { stroke: #00ffc8; } .ps .bar.g-img { fill: #00ffc8; stroke: none; }
    .ps .g-rf { stroke: #ffb454; } .ps .bar.g-rf { fill: #ffb454; stroke: none; }
    .ps .g-sch { stroke: #b18cff; } .ps .bar.g-sch { fill: #b18cff; stroke: none; }
    .ps .g-wf { stroke: #6ea8ff; } .ps .bar.g-wf { fill: #6ea8ff; stroke: none; }
    .ps .g-inv { stroke: #7cc977; } .ps .bar.g-inv { fill: #7cc977; stroke: none; }
    .ps .g-obs { stroke: #ff5c8a; } .ps .bar.g-obs { fill: #ff5c8a; stroke: none; }
    .ps .g-sec { stroke: #e5c04a; } .ps .bar.g-sec { fill: #e5c04a; stroke: none; }
    .ps .g-hw { stroke: #6f8f97; } .ps .bar.g-hw { fill: #6f8f97; stroke: none; }
    /* motion: a connection's dashes run the way it points; the hardware link stays still */
    @keyframes ps-flow { to { stroke-dashoffset: -18; } }
    .ps .edge { animation: ps-flow 1.2s linear infinite; }
    .ps .edge.g-hw { animation: none; }
    @media (prefers-reduced-motion: reduce) { .ps .edge { animation: none; } }
  </style>
