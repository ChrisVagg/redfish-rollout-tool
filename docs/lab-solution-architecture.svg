<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The lab today, drawn on the production firmware-update system's layout: only what the lab implements is drawn, each part where the production system has it. Supply chain: control/ingest/download-fw-package.sh downloads the two newest GB200 NVL builds over HTTPS from OpenBMC's Jenkins, the lab's vendor channel; control/ingest/verify-fw-package.sh checks each package in the sandbox, a container with no network, a read-only root and no privileges: only an OpenBMC package's regular files, its signatures against OpenBMC's development key pinned in the repository, and its MANIFEST's machine; control/ingest/promote-store-fw-package.sh checks each listed package's sha256 again, uploads both into the approved store, a SeaweedFS bucket that serves as the source for cached copies and allows anonymous S3 reads only, records their sha256, approves the newer as is, and deletes the downloads. The ingest's scripts enforce the checks, not the store; there is no quarantine host and no lab test. Control plane: the make targets are the CLI, YES=1 the approval; no API yet; pipeline.sh and rollout.py are the local pipeline controller, reading the firmware catalog, baseline.yaml and images.yaml, and the inventory from NetBox, read by each service with its own read-only account; the rollout state is PostgreSQL, a lock per host and every event, beside the run records, runs/*.jsonl, and Grafana reads it over SQL with an account that may only read; no resume; the BMC logins are static, OpenBMC's public default set in the Makefile; no Vault. Each site: rollout.py run is the site agent; it fetches each image from the image cache, nginx over HTTPS on port 8443, which fetches it from the store on cache misses, and pushes it to the BMCs, ten emulated in QEMU, with update, tasks and reset over Redfish. Observability, metrics and events: rollout.py run pushes every run's metrics to the Pushgateway on port 9091, PUT /metrics/job/rollout, and sends every event of its run record to Loki on port 3100, POST /loki/api/v1/push; exporter-lab, poller.py exporter on port 9101 beside the BMCs, reads every BMC over Redfish every 10 seconds, and the site's Prometheus agent scrapes it every 10 seconds and pushes the samples to Prometheus on port 9090 (remote write), so the control plane never connects into the site; Prometheus scrapes GET /metrics from the Pushgateway every 5 seconds; Grafana on port 3000 has Prometheus, Loki and the state database as its data sources. BMC events: make subscribe gives each lab BMC one EventService subscription, and the BMC posts each event to the site's event receiver, Vector on port 8088, behind the credentials the subscription carries; Vector writes one Loki line per event, job bmc-event. The exporter also sends each BMC's new log entries to Loki every 5 minutes. The dashed outlines' colours show where each section runs: blue for the control plane, with its supply chain and observability; amber for each site's management network.">
  <style>
    .pl text { font-family: var(--mono, monospace); }
    .pl .bg { fill: var(--bg-deep, #050708); }
    .pl .box { fill: var(--surface, #0d1417); stroke: var(--line, #2a3538); }
    .pl .name { fill: var(--fg, #e6f7fa); font-size: 12.5px; font-weight: 600; }
    .pl .sub { fill: var(--dim, #6f8f97); font-size: 10px; }
    .pl .band { fill: var(--dim, #6f8f97); font-size: 9.5px; letter-spacing: .14em; }
    .pl .band.hi { fill: var(--teal, #00ffc8); }
    .pl .lbl { fill: var(--dim, #6f8f97); font-size: 10px; }
    .pl .cut { fill: none; stroke: var(--line, #2a3538); stroke-width: 1; stroke-dasharray: 5 5; }
    /* where a section runs: the planes' blue and amber in lab-stack.svg, muted so an outline doesn't read as a connection */
    .pl .cut.ctl { stroke: #476da2; }
    .pl .cut.site { stroke: #9e743c; }
    /* a connection in its service's colour */
    .pl .edge { fill: none; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .pl .elabel { fill: var(--fg, #e6f7fa); font-size: 10px; paint-order: stroke; stroke: var(--bg-deep, #050708); stroke-width: 4px; stroke-linejoin: round; }
    .pl .g-img { stroke: #00ffc8; } .pl .bar.g-img { fill: #00ffc8; stroke: none; }
    .pl .g-rf { stroke: #ffb454; } .pl .bar.g-rf { fill: #ffb454; stroke: none; }
    .pl .g-wf { stroke: #6ea8ff; } .pl .bar.g-wf { fill: #6ea8ff; stroke: none; }
    .pl .g-inv { stroke: #7cc977; } .pl .bar.g-inv { fill: #7cc977; stroke: none; }
    .pl .g-obs { stroke: #ff5c8a; } .pl .bar.g-obs { fill: #ff5c8a; stroke: none; }
    .pl .g-sec { stroke: #e5c04a; } .pl .bar.g-sec { fill: #e5c04a; stroke: none; }
    /* motion: a connection's dashes run the way it points */
    @keyframes pl-flow { to { stroke-dashoffset: -18; } }
    .pl .edge { animation: pl-flow 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .pl .edge { animation: none; } }
  </style>
  <defs>
    <marker id="pl-img" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #00ffc8"/></marker>
    <marker id="pl-rf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #ffb454"/></marker>
    <marker id="pl-wf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #6ea8ff"/></marker>
    <marker id="pl-inv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #7cc977"/></marker>
    <marker id="pl-obs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #ff5c8a"/></marker>
    <marker id="pl-sec" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #e5c04a"/></marker>
  </defs>
