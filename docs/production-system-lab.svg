    <text class="name" x="135" y="64" text-anchor="middle">Vendor downloads</text><text class="sub" x="135" y="80" text-anchor="middle">download-fw-images.sh</text>
    <rect class="box" x="250" y="44" width="190" height="46" rx="8"/><rect class="bar g-img" x="250" y="52" width="3" height="30" rx="1.5"/>
    <text class="name" x="345" y="64" text-anchor="middle">Ingest</text><text class="sub" x="345" y="80" text-anchor="middle">promote-fw-images.sh</text>
    <rect class="box" x="670" y="44" width="190" height="46" rx="8"/><rect class="bar g-img" x="670" y="52" width="3" height="30" rx="1.5"/>
    <text class="name" x="765" y="64" text-anchor="middle">Approved store</text><text class="sub" x="765" y="80" text-anchor="middle">SeaweedFS bucket</text>
    <path class="edge g-img" d="M230 67H246" marker-end="url(#pl-img)"/>
    <path class="edge g-img" d="M440 67H666" marker-end="url(#pl-img)"/>
