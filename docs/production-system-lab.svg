    <text class="name" x="535" y="490" text-anchor="middle">BMCs</text><text class="sub" x="535" y="506" text-anchor="middle">10 emulated in QEMU</text>
    <rect class="box" x="666" y="470" width="198" height="46" rx="8"/><rect class="bar g-obs" x="666" y="478" width="3" height="30" rx="1.5"/>
    <text class="name" x="765" y="490" text-anchor="middle">exporter-lab</text><text class="sub" x="765" y="506" text-anchor="middle">:9101</text>
    <path class="edge g-wf" d="M345 252V386" marker-end="url(#pl-wf)"/>
