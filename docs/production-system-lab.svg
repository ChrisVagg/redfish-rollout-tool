    <rect class="box" x="260" y="390" width="170" height="46" rx="8"/><rect class="bar g-wf" x="260" y="398" width="3" height="30" rx="1.5"/>
    <text class="name" x="345" y="410" text-anchor="middle">Site agent</text><text class="sub" x="345" y="426" text-anchor="middle">rollout.py run</text>
