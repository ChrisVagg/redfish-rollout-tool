    <g class="badge"><title>Stage 5: Post-checks</title><circle cx="526" cy="605" r="8"/><text x="526" y="608.5" text-anchor="middle">5</text></g>
    <text class="lbl" x="540" y="608">Post-check · roll back</text>
    <text class="lbl" x="700" y="608">2 drain, 6 undrain: none</text>
  </g>
</svg>
