    <rect class="box" x="40" y="140" width="170" height="46" rx="8"/><rect class="bar g-wf" x="40" y="148" width="3" height="30" rx="1.5"/>
    <text class="name" x="125" y="160" text-anchor="middle">Rollout API + CLI</text><text class="sub" x="125" y="176" text-anchor="middle">make · YES=1 approves</text>
    <rect class="box" x="40" y="206" width="170" height="46" rx="8"/><rect class="bar g-inv" x="40" y="214" width="3" height="30" rx="1.5"/>
    <text class="name" x="125" y="226" text-anchor="middle">Firmware catalog</text><text class="sub" x="125" y="242" text-anchor="middle">baseline · images.yaml</text>
    <rect class="box" x="40" y="266" width="170" height="46" rx="8"/><rect class="bar g-inv" x="40" y="274" width="3" height="30" rx="1.5"/>
    <text class="name" x="125" y="286" text-anchor="middle">Inventory / CMDB</text><text class="sub" x="125" y="302" text-anchor="middle">lab/inventory.yaml</text>
    <rect class="box" x="260" y="206" width="170" height="46" rx="8"/><rect class="bar g-wf" x="260" y="214" width="3" height="30" rx="1.5"/>
    <text class="name" x="345" y="226" text-anchor="middle">Workflow engine</text><text class="sub" x="345" y="242" text-anchor="middle">pipeline.sh · rollout.py</text>
    <rect class="box" x="450" y="206" width="170" height="46" rx="8"/><rect class="bar g-wf" x="450" y="214" width="3" height="30" rx="1.5"/>
    <text class="name" x="535" y="226" text-anchor="middle">Rollout state DB</text><text class="sub" x="535" y="242" text-anchor="middle">runs/*.jsonl · no locks</text>
    <rect class="box" x="450" y="266" width="170" height="46" rx="8"/><rect class="bar g-sec" x="450" y="274" width="3" height="30" rx="1.5"/>
    <text class="name" x="535" y="286" text-anchor="middle">Secrets</text><text class="sub" x="535" y="302" text-anchor="middle">static logins · no Vault</text>
    <path class="edge g-wf" d="M210 163H235V218H256" marker-end="url(#pl-wf)"/>
    <path class="edge g-inv" d="M210 229H256" marker-end="url(#pl-inv)"/>
    <path class="edge g-inv" d="M210 289H235V240H256" marker-end="url(#pl-inv)"/>
