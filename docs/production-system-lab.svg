    <!-- where each stage happens in the lab: the update is a push, then reset, post-check and rollback at the BMCs -->
    <g class="badge"><title>Stage 0: Ingest</title><circle cx="430" cy="44" r="8"/><text x="430" y="47.5" text-anchor="middle">0</text></g>
    <g class="badge"><title>Stage 1: Plan and pre-flight</title><circle cx="235" cy="192" r="8"/><text x="235" y="195.5" text-anchor="middle">1</text></g>
    <g class="badge"><title>Stage 3: Update, a push</title><circle cx="615" cy="428" r="8"/><text x="615" y="431.5" text-anchor="middle">3</text></g>
    <g class="badge"><title>Stage 4: Reset of the BMC</title><circle cx="470" cy="470" r="8"/><text x="470" y="473.5" text-anchor="middle">4</text></g>
    <g class="badge"><title>Stage 5: Post-check over Redfish, and the rollback when it fails</title><circle cx="490" cy="470" r="8"/><text x="490" y="473.5" text-anchor="middle">5</text></g>
