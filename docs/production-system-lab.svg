    <rect class="box" x="666" y="144" width="198" height="40" rx="8"/><rect class="bar g-obs" x="666" y="150" width="3" height="28" rx="1.5"/>
    <text class="name" x="765" y="160" text-anchor="middle">Pushgateway</text><text class="sub" x="765" y="175" text-anchor="middle">:9091</text>
