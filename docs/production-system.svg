    <path class="edge g-inv" d="M150 577H172"/><text class="lbl" x="180" y="580">Inventory and catalog</text>
    <path class="edge g-obs" d="M335 577H357"/><text class="lbl" x="365" y="580">Observability</text>
    <path class="edge g-sec" d="M520 577H542"/><text class="lbl" x="550" y="580">Secrets</text>
    <path class="edge g-hw" d="M705 577H727"/><text class="lbl" x="735" y="580">Hardware</text>
    <text class="band" x="20" y="608">ROLLOUT STAGES</text>
