    <rect class="cut" x="20" y="30" width="860" height="74" rx="10"/>
    <rect class="box" x="40" y="44" width="190" height="46" rx="8"/><rect class="bar g-img" x="40" y="52" width="3" height="30" rx="1.5"/>
    <text class="name" x="135" y="72" text-anchor="middle">Vendor downloads</text>
