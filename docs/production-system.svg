    <g class="badge"><title>Stage 3: Update</title><circle cx="452" cy="605" r="8"/><text x="452" y="608.5" text-anchor="middle">3</text></g>
    <text class="lbl" x="466" y="608">Update</text>
    <g class="badge"><title>Stage 4: Reset</title><circle cx="526" cy="605" r="8"/><text x="526" y="608.5" text-anchor="middle">4</text></g>
    <text class="lbl" x="540" y="608">Reset</text>
    <g class="badge"><title>Stage 5: Post-checks</title><circle cx="594" cy="605" r="8"/><text x="594" y="608.5" text-anchor="middle">5</text></g>
    <text class="lbl" x="608" y="608">Post-checks</text>
    <g class="badge"><title>Stage 6: Undrain, or roll back</title><circle cx="698" cy="605" r="8"/><text x="698" y="608.5" text-anchor="middle">6</text></g>
    <text class="lbl" x="712" y="608">Undrain, or roll back</text>
  </g>
</svg>
