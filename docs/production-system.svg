    <text class="name" x="345" y="64" text-anchor="middle">Ingest</text><text class="sub" x="345" y="80" text-anchor="middle">checksum · signature</text>
    <rect class="box" x="460" y="44" width="190" height="46" rx="8"/><rect class="bar g-img" x="460" y="52" width="3" height="30" rx="1.5"/>
    <text class="name" x="555" y="64" text-anchor="middle">Lab test</text><text class="sub" x="555" y="80" text-anchor="middle">real hosts, all models</text>
    <rect class="box" x="670" y="44" width="190" height="46" rx="8"/><rect class="bar g-img" x="670" y="52" width="3" height="30" rx="1.5"/>
    <text class="name" x="765" y="64" text-anchor="middle">Approved store</text><text class="sub" x="765" y="80" text-anchor="middle">Artifactory or S3</text>
