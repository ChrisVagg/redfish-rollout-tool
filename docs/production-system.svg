<svg viewBox="0 0 900 628" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A production firmware-update system, the target for this rollout at fleet scale. Supply chain: vendor images are downloaded, ingested with their checksum and signature checked, tested on lab hosts of every model, and promoted into an approved store such as Artifactory or S3. Control plane: an operator requests and approves a rollout through an API and CLI; a workflow engine such as Temporal (or Argo) reads the firmware catalog of baselines and images per model and the inventory in Nautobot, keeps its execution history in its own store, and writes each host's state, locks and audit trail to a rollout state database in PostgreSQL. Each site, on its management network: a site agent takes the work of each wave, gets short-lived credentials from Vault, drains and undrains hosts through the scheduler, Slurm or Kubernetes, drives updates, tasks and resets over Redfish on the BMCs, and reports inventory and health back; a site image cache fetches each image from the approved store once per site; a BMC that offers SimpleUpdate pulls it from the cache, and for a push-only BMC the agent reads it from the cache and pushes it to MultipartHttpPushUri; the BMCs manage the GPU hosts. Observability: the engine and the agents send events and metrics to Prometheus and Grafana, and halts and quarantines raise alerts in PagerDuty. Numbered badges mark where each rollout stage happens: 0 ingest, 1 plan and pre-flight, 2 drain, 3 update, 4 reset, 5 post-checks, 6 undrain or roll back.">
  <style>
    .ps text { font-family: var(--mono, monospace); }
    .ps .bg { fill: var(--bg-deep, #050708); }
    .ps .box { fill: var(--surface, #0d1417); stroke: var(--line, #2a3538); }
    .ps .name { fill: var(--fg, #e6f7fa); font-size: 12.5px; font-weight: 600; }
    .ps .sub { fill: var(--dim, #6f8f97); font-size: 10px; }
    .ps .band { fill: var(--dim, #6f8f97); font-size: 9.5px; letter-spacing: .14em; }
    .ps .band.hi { fill: var(--teal, #00ffc8); }
    .ps .lbl { fill: var(--dim, #6f8f97); font-size: 10px; }
    .ps .cut { fill: none; stroke: var(--line, #2a3538); stroke-width: 1; stroke-dasharray: 5 5; }
    /* a connection in its service's colour; the hardware link is the only solid one */
    .ps .edge { fill: none; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ps .edge.g-hw { stroke-dasharray: none; }
    .ps .elabel { fill: var(--fg, #e6f7fa); font-size: 10px; paint-order: stroke; stroke: var(--bg-deep, #050708); stroke-width: 4px; stroke-linejoin: round; }
    .ps .badge circle { fill: var(--amber, #ffb454); }
    .ps .badge text { fill: var(--bg-deep, #050708); font-size: 10px; font-weight: 700; }
    .ps .g-img { stroke: #00ffc8; } .ps .bar.g-img { fill: #00ffc8; stroke: none; }
    .ps .g-rf { stroke: #ffb454; } .ps .bar.g-rf { fill: #ffb454; stroke: none; }
    .ps .g-sch { stroke: #b18cff; } .ps .bar.g-sch { fill: #b18cff; stroke: none; }
    .ps .g-wf { stroke: #6ea8ff; } .ps .bar.g-wf { fill: #6ea8ff; stroke: none; }
    .ps .g-inv { stroke: #7cc977; } .ps .bar.g-inv { fill: #7cc977; stroke: none; }
    .ps .g-obs { stroke: #ff5c8a; } .ps .bar.g-obs { fill: #ff5c8a; stroke: none; }
    .ps .g-sec { stroke: #e5c04a; } .ps .bar.g-sec { fill: #e5c04a; stroke: none; }
    .ps .g-hw { stroke: #6f8f97; } .ps .bar.g-hw { fill: #6f8f97; stroke: none; }
    /* motion: a connection's dashes run the way it points; the hardware link stays still */
    @keyframes ps-flow { to { stroke-dashoffset: -18; } }
    .ps .edge { animation: ps-flow 1.2s linear infinite; }
    .ps .edge.g-hw { animation: none; }
    @media (prefers-reduced-motion: reduce) { .ps .edge { animation: none; } }
  </style>
  <defs>
    <marker id="ps-img" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #00ffc8"/></marker>
    <marker id="ps-rf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #ffb454"/></marker>
    <marker id="ps-sch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #b18cff"/></marker>
    <marker id="ps-wf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #6ea8ff"/></marker>
    <marker id="ps-inv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #7cc977"/></marker>
    <marker id="ps-obs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #ff5c8a"/></marker>
    <marker id="ps-sec" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #e5c04a"/></marker>
  </defs>
  <g class="ps">
