    <path class="edge g-img" d="M440 67H456" marker-end="url(#ps-img)"/>
    <path class="edge g-img" d="M650 67H666" marker-end="url(#ps-img)"/>
    <text class="band hi" x="20" y="124">CONTROL PLANE</text>
    <rect class="cut" x="20" y="130" width="610" height="200" rx="10"/>
    <rect class="box" x="40" y="140" width="170" height="46" rx="8"/><rect class="bar g-wf" x="40" y="148" width="3" height="30" rx="1.5"/>
