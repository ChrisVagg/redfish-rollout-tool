    <text class="name" x="125" y="226" text-anchor="middle">Firmware catalog</text><text class="sub" x="125" y="242" text-anchor="middle">baselines · images per model</text>
    <rect class="box" x="40" y="266" width="170" height="46" rx="8"/><rect class="bar g-inv" x="40" y="274" width="3" height="30" rx="1.5"/>
    <text class="name" x="125" y="286" text-anchor="middle">Inventory / CMDB</text><text class="sub" x="125" y="302" text-anchor="middle">Nautobot</text>
    <rect class="box" x="260" y="140" width="170" height="46" rx="8"/><rect class="bar g-wf" x="260" y="148" width="3" height="30" rx="1.5"/>
    <text class="name" x="345" y="160" text-anchor="middle">Engine store</text><text class="sub" x="345" y="176" text-anchor="middle">workflow history</text>
