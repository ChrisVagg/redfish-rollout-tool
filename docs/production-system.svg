    <path class="edge g-obs" d="M430 404H640V175H662" marker-end="url(#ps-obs)"/>
    <text class="elabel" x="535" y="400" text-anchor="middle">events · metrics</text>
    <g class="badge"><title>Stage 0: Ingest</title><circle cx="430" cy="44" r="8"/><text x="430" y="47.5" text-anchor="middle">0</text></g>
    <g class="badge"><title>Stage 1: Plan and pre-flight</title><circle cx="235" cy="192" r="8"/><text x="235" y="195.5" text-anchor="middle">1</text></g>
    <g class="badge"><title>Stage 2: Drain</title><circle cx="143" cy="442" r="8"/><text x="143" y="445.5" text-anchor="middle">2</text></g>
    <g class="badge"><title>Stage 3: Update</title><circle cx="790" cy="452" r="8"/><text x="790" y="455.5" text-anchor="middle">3</text></g>
    <g class="badge"><title>Stage 4: Reset</title><circle cx="643" cy="478" r="8"/><text x="643" y="481.5" text-anchor="middle">4</text></g>
    <g class="badge"><title>Stage 5: Post-checks</title><circle cx="304" cy="368" r="8"/><text x="304" y="371.5" text-anchor="middle">5</text></g>
    <g class="badge"><title>Stage 6: Undrain, or roll back</title><circle cx="163" cy="442" r="8"/><text x="163" y="445.5" text-anchor="middle">6</text></g>
