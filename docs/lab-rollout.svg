<svg viewBox="0 0 900 1178" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The lab's firmware update rollout. 01 Plan, rollout.py plan: each BMC is read live: the service root; the Manager with its firmware version, its active software image and its reset types, GracefulRestart and ForceRestart; the UpdateService, push only to its MultipartHttpPushUri; one image in the firmware inventory; the TaskService, and no JobService. The image comes from the store through the cache into lab/spool, its sha256 checked against images.yaml. Pre-flight makes 16 checks per BMC and decides go, skip when already on the target, or block. The waves: canary bmc1, wave 1 bmc2 to bmc4 one per rack and strict, wave 2 bmc5 to bmc10 at most two per rack; halt over 10%, soak 60 seconds, 10 at once. plan.json freezes the inputs, the policy, the waves and each BMC's identity. 02 Canary, then waves, rollout.py run: a changed input or --halt-at is refused. Each BMC of a wave, side by side: 1 pre-flight again on a fresh read, the same BMC as planned; 2 drain skipped, the Manager's reset leaves the host running; 3 a multipart push with Targets the Manager and OperationApplyTime OnReset, its Task followed until it ends, no Job; 4 Manager.Reset GracefulRestart and a wait of up to 900 seconds, the new build running; 5 post-check: the target version, health OK or no worse, no new failed task; 6 undrain skipped. A Task that ends in Exception fails before the reset: the old build runs and nothing waits to apply. After the reset, a failed post-check or a BMC not back in 900 seconds is rolled back by reinstalling the build from before, steps 3 to 5 again: rolled_back when verified, needs_attention otherwise. After each wave a 60 second soak and the post-check again, then the gate: the canary and wave 1 halt on any failure, wave 2 over 10%.">
  <style>
    .lro text { font-family: var(--mono, monospace); }
    .lro .bg { fill: var(--bg-deep, #050708); }
    .lro .box { fill: var(--surface, #0d1417); stroke: var(--line, #2a3538); }
    .lro .box.ghost { fill: none; stroke-dasharray: 4 4; }
    .lro .name { fill: var(--fg, #e6f7fa); font-size: 12.5px; font-weight: 600; }
    .lro .sub { fill: var(--dim, #6f8f97); font-size: 10px; }
    .lro .txt { fill: var(--fg, #e6f7fa); font-size: 10px; }
    .lro .band { fill: var(--dim, #6f8f97); font-size: 9.5px; letter-spacing: .14em; }
    .lro .band.hi { fill: var(--teal, #00ffc8); }
    .lro .lbl { fill: var(--dim, #6f8f97); font-size: 10px; }
    .lro .cut { fill: none; stroke: var(--line, #2a3538); stroke-width: 1; stroke-dasharray: 5 5; }
    .lro .chip { fill: var(--bg-deep, #050708); stroke: var(--line, #2a3538); }
    /* a connection in the colour of what it talks to; the way back is drawn in shorter dashes */
    .lro .edge { fill: none; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .lro .edge.g-back { stroke-dasharray: 3 3; }
    .lro .elabel { fill: var(--fg, #e6f7fa); font-size: 10px; paint-order: stroke; stroke: var(--bg-deep, #050708); stroke-width: 4px; stroke-linejoin: round; }
    .lro .elabel.c-back { fill: #ff5c8a; }
    .lro .gate { fill: var(--surface, #0d1417); stroke: #ff5c8a; }
    .lro .badge circle { fill: var(--amber, #ffb454); }
    .lro .badge text { fill: var(--bg-deep, #050708); font-size: 10px; font-weight: 700; }
    .lro a text { text-decoration: underline; }
    .lro .g-wf { stroke: #6ea8ff; } .lro .bar.g-wf { fill: #6ea8ff; stroke: none; } .lro text.c-wf { fill: #6ea8ff; }
    .lro .g-rf { stroke: #ffb454; } .lro .bar.g-rf { fill: #ffb454; stroke: none; } .lro text.c-rf { fill: #ffb454; }
    .lro .g-sch { stroke: #b18cff; } .lro .bar.g-sch { fill: #b18cff; stroke: none; } .lro text.c-sch { fill: #b18cff; }
    .lro .g-img { stroke: #00ffc8; } .lro .bar.g-img { fill: #00ffc8; stroke: none; } .lro text.c-img { fill: #00ffc8; }
    .lro .g-back { stroke: #ff5c8a; } .lro .bar.g-back { fill: #ff5c8a; stroke: none; } .lro text.c-back { fill: #ff5c8a; }
    .lro .g-ev { stroke: #6f8f97; } .lro .bar.g-ev { fill: #6f8f97; stroke: none; } .lro text.c-ev { fill: #6f8f97; }
    /* motion: a connection's dashes run the way it points */
    @keyframes lro-flow { to { stroke-dashoffset: -18; } }
    .lro .edge { animation: lro-flow 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .lro .edge { animation: none; } }
  </style>
  <defs>
    <marker id="lro-wf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #6ea8ff"/></marker>
    <marker id="lro-rf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #ffb454"/></marker>
    <marker id="lro-sch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #b18cff"/></marker>
    <marker id="lro-img" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #00ffc8"/></marker>
    <marker id="lro-back" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #ff5c8a"/></marker>
    <marker id="lro-ev" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" style="fill: #6f8f97"/></marker>
  </defs>
  <g class="lro">
    <rect class="bg" x="0" y="0" width="900" height="1178" rx="12"/>
    <text class="band" x="20" y="24">01 · PLAN · rollout.py plan</text>
    <rect class="box" x="40" y="52" width="272" height="142" rx="8"/>
    <rect class="bar g-wf" x="40" y="60" width="3" height="126" rx="1.5"/>
    <g class="badge"><title>Stage 1: Plan and pre-flight</title><circle cx="59" cy="70" r="8"/><text x="59" y="73.5" text-anchor="middle">1</text></g>
    <text class="name" x="74" y="74">Live read · each BMC</text>
    <text class="txt" x="56" y="91">ServiceRoot</text>
    <text class="txt" x="56" y="104">Managers/bmc</text>
    <text class="sub" x="68" y="117">FirmwareVersion · ActiveSoftwareImage</text>
    <text class="sub" x="68" y="130">Reset: GracefulRestart, ForceRestart</text>
    <text class="txt" x="56" y="143">UpdateService</text>
    <text class="sub" x="68" y="156">MultipartHttpPushUri: push only</text>
    <text class="txt" x="56" y="169">FirmwareInventory: one image</text>
    <text class="txt" x="56" y="182">TaskService · no JobService</text>
    <rect class="box" x="40" y="208" width="272" height="77" rx="8"/>
    <rect class="bar g-img" x="40" y="216" width="3" height="61" rx="1.5"/>
    <text class="name" x="56" y="230">Image</text>
    <text class="txt" x="56" y="247">store → cache → lab/spool/</text>
    <text class="txt" x="56" y="260">sha256 = images.yaml</text>
    <text class="sub" x="68" y="273">else the copy is deleted: block</text>
    <rect class="box" x="328" y="52" width="320" height="181" rx="8"/>
    <rect class="bar g-wf" x="328" y="60" width="3" height="165" rx="1.5"/>
    <text class="name" x="344" y="74">Pre-flight · 16 checks per BMC</text>
    <text class="txt" x="344" y="91">live read · baseline · update target</text>
    <text class="txt" x="344" y="104">running version · needs the update</text>
    <text class="txt" x="344" y="117">direction · Updateable · nothing staged</text>
    <text class="txt" x="344" y="130">image in the catalog · sha256 · size</text>
    <text class="txt" x="344" y="143">rollback path: the running build's</text>
    <text class="sub" x="356" y="156">package in images.yaml, to reinstall</text>
    <text class="txt" x="344" y="169">update service · push allowed</text>
    <text class="txt" x="344" y="182">health OK · no failed or open task</text>
    <text class="txt c-wf" x="344" y="195">go: into the canary or a wave</text>
    <text class="sub" x="344" y="208">skip: already on the target</text>
    <text class="txt c-back" x="344" y="221">block: a person has to look</text>
    <rect class="box" x="664" y="52" width="196" height="181" rx="8"/>
    <rect class="bar g-wf" x="664" y="60" width="3" height="165" rx="1.5"/>
    <text class="name" x="680" y="74">Waves</text>
    <text class="txt" x="680" y="91">canary: bmc1</text>
    <text class="txt" x="680" y="104">wave 1: bmc2-4</text>
    <text class="sub" x="692" y="117">one per rack · strict</text>
    <text class="txt" x="680" y="130">wave 2: bmc5-10</text>
    <text class="sub" x="692" y="143">at most 2 per rack</text>
    <text class="sub" x="680" y="156">halt over 10% · soak 60 s</text>
    <text class="sub" x="680" y="169">10 at once</text>
    <text class="txt" x="680" y="182">plan.json freezes</text>
    <text class="sub" x="692" y="195">the inputs' sha256</text>
    <text class="sub" x="692" y="208">the policy · the waves</text>
    <text class="sub" x="692" y="221">each BMC's identity</text>
    <path class="edge g-wf" d="M312 110H324" marker-end="url(#lro-wf)"/>
    <path class="edge g-img" d="M312 234H324" marker-end="url(#lro-img)"/>
    <path class="edge g-wf" d="M648 110H660" marker-end="url(#lro-wf)"/>
    <rect class="cut" x="20" y="40" width="860" height="259" rx="10"/>
    <text class="band" x="20" y="325">02 · CANARY, THEN WAVES · rollout.py run</text>
    <rect class="box" x="40" y="353" width="820" height="51" rx="8"/>
    <rect class="bar g-wf" x="40" y="361" width="3" height="35" rx="1.5"/>
    <text class="name" x="56" y="375">Before any BMC</text>
    <text class="sub" x="56" y="392">an input file changed since the plan, or --halt-at → refused: plan again</text>
    <text class="band" x="40" y="426">EACH BMC OF A WAVE, SIDE BY SIDE</text>
    <rect class="box" x="40" y="436" width="500" height="77" rx="8"/>
    <rect class="bar g-wf" x="40" y="444" width="3" height="61" rx="1.5"/>
    <g class="badge"><title>Stage 1: Plan and pre-flight</title><circle cx="59" cy="454" r="8"/><text x="59" y="457.5" text-anchor="middle">1</text></g>
    <text class="name" x="74" y="458">Pre-flight again</text>
    <text class="sub" x="56" y="475">a fresh read just before the BMC is touched · the same 16 checks</text>
    <text class="sub" x="56" y="488">the BMC must be the one the plan read: the same service UUID</text>
    <text class="sub" x="56" y="501">not go → skipped or blocked, nothing written</text>
    <rect class="box" x="40" y="527" width="500" height="51" rx="8"/>
    <rect class="bar g-sch" x="40" y="535" width="3" height="35" rx="1.5"/>
    <g class="badge"><title>Stage 2: Drain</title><circle cx="59" cy="545" r="8"/><text x="59" y="548.5" text-anchor="middle">2</text></g>
    <text class="name" x="74" y="549">Drain · skipped</text>
    <text class="sub" x="56" y="566">the reset is the Manager's: the host keeps running</text>
    <rect class="box" x="40" y="592" width="500" height="116" rx="8"/>
    <rect class="bar g-rf" x="40" y="600" width="3" height="100" rx="1.5"/>
    <g class="badge"><title>Stage 3: Update</title><circle cx="59" cy="610" r="8"/><text x="59" y="613.5" text-anchor="middle">3</text></g>
    <text class="name" x="74" y="614">Update · a multipart push, applied on reset</text>
    <text class="txt" x="56" y="631">POST /redfish/v1/UpdateService/update-multipart</text>
    <text class="sub" x="68" y="644">UpdateParameters: Targets /redfish/v1/Managers/bmc</text>
    <text class="sub" x="80" y="657">@Redfish.OperationApplyTime: OnReset</text>
    <text class="sub" x="68" y="670">UpdateFile: the spooled package</text>
    <text class="txt" x="56" y="683">202 Accepted → the Task, followed until it ends · no Job</text>
    <text class="sub" x="56" y="696">Completed: the old build runs until the reset</text>
    <rect class="box" x="40" y="722" width="500" height="64" rx="8"/>
    <rect class="bar g-rf" x="40" y="730" width="3" height="48" rx="1.5"/>
    <g class="badge"><title>Stage 4: Reset</title><circle cx="59" cy="740" r="8"/><text x="59" y="743.5" text-anchor="middle">4</text></g>
    <text class="name" x="74" y="744">Reset · the Manager alone</text>
    <text class="txt" x="56" y="761">#Manager.Reset GracefulRestart on /redfish/v1/Managers/bmc</text>
    <text class="sub" x="56" y="774">wait until it answers again, up to 900 s: the new build runs</text>
    <rect class="box" x="40" y="800" width="500" height="90" rx="8"/>
    <rect class="bar g-rf" x="40" y="808" width="3" height="74" rx="1.5"/>
    <g class="badge"><title>Stage 5: Post-check</title><circle cx="59" cy="818" r="8"/><text x="59" y="821.5" text-anchor="middle">5</text></g>
    <text class="name" x="74" y="822">Post-check</text>
    <text class="sub" x="56" y="839">a fresh read, waiting up to 3 min for the firmware inventory</text>
    <text class="txt" x="56" y="852">FirmwareVersion = the target</text>
    <text class="sub" x="56" y="865">Systems/system and Managers/bmc health OK, or no worse</text>
    <text class="sub" x="56" y="878">no new failed task</text>
    <rect class="box" x="40" y="904" width="500" height="51" rx="8"/>
    <rect class="bar g-sch" x="40" y="912" width="3" height="35" rx="1.5"/>
    <g class="badge"><title>Stage 6: Undrain</title><circle cx="59" cy="922" r="8"/><text x="59" y="925.5" text-anchor="middle">6</text></g>
    <text class="name" x="74" y="926">Undrain · skipped</text>
    <text class="sub" x="56" y="943">nothing was drained</text>
    <path class="edge g-wf" d="M290 513V523" marker-end="url(#lro-wf)"/>
    <path class="edge g-wf" d="M290 578V588" marker-end="url(#lro-wf)"/>
    <path class="edge g-wf" d="M290 708V718" marker-end="url(#lro-wf)"/>
    <path class="edge g-wf" d="M290 786V796" marker-end="url(#lro-wf)"/>
    <path class="edge g-wf" d="M290 890V900" marker-end="url(#lro-wf)"/>
    <rect class="box" x="560" y="592" width="300" height="77" rx="8"/>
    <rect class="bar g-back" x="560" y="600" width="3" height="61" rx="1.5"/>
    <text class="name" x="576" y="614">Fails before the reset</text>
    <text class="sub" x="576" y="631">the Task ends Exception: the image refused</text>
    <text class="txt" x="576" y="644">→ failed: the old build runs</text>
    <text class="sub" x="576" y="657">nothing waits to apply: nothing to Cancel</text>
    <rect class="box" x="560" y="722" width="300" height="116" rx="8"/>
    <rect class="bar g-back" x="560" y="730" width="3" height="100" rx="1.5"/>
    <text class="name" x="576" y="744">Roll back</text>
    <text class="sub" x="576" y="761">the post-check failed, or not back in 900 s</text>
    <text class="txt" x="576" y="774">reinstall the build from before</text>
    <text class="sub" x="588" y="787">its package from images.yaml</text>
    <text class="sub" x="588" y="800">steps 3 to 5 again</text>
    <text class="txt c-wf" x="576" y="813">verified → rolled_back</text>
    <text class="txt c-back" x="576" y="826">fails → needs_attention</text>
    <rect class="box" x="560" y="852" width="300" height="64" rx="8"/>
    <rect class="bar g-wf" x="560" y="860" width="3" height="48" rx="1.5"/>
    <text class="name" x="576" y="874">Where each BMC ends</text>
    <text class="sub" x="576" y="891">updated · failed · rolled_back</text>
    <text class="sub" x="576" y="904">needs_attention · skipped · blocked</text>
    <path class="edge g-back" d="M540 626H556" marker-end="url(#lro-back)"/>
    <path class="edge g-back" d="M540 756H556" marker-end="url(#lro-back)"/>
    <path class="edge g-back" d="M540 834H550V782H556" marker-end="url(#lro-back)"/>
    <text class="band" x="40" y="977">AFTER THE WAVE</text>
    <rect class="box" x="40" y="987" width="400" height="64" rx="8"/>
    <rect class="bar g-wf" x="40" y="995" width="3" height="48" rx="1.5"/>
    <text class="name" x="56" y="1009">Soak · 60 s</text>
    <text class="sub" x="56" y="1026">then the post-check again on each BMC the wave updated</text>
    <text class="sub" x="56" y="1039">a failure → needs_attention · not after the last wave</text>
    <rect class="box" x="500" y="987" width="360" height="77" rx="8"/>
    <rect class="bar g-back" x="500" y="995" width="3" height="61" rx="1.5"/>
    <text class="name" x="516" y="1009">Gate</text>
    <text class="sub" x="516" y="1026">the canary, wave 1: any failure halts</text>
    <text class="sub" x="516" y="1039">wave 2: halts over 10% failed · a soak failure halts</text>
    <text class="txt c-back" x="516" y="1052">halted: the waves left don't run</text>
    <path class="edge g-back" d="M440 1017H496" marker-end="url(#lro-back)"/>
    <path class="gate" d="M468 1009l8 8-8 8-8-8z"/>
    <rect class="cut" x="20" y="341" width="860" height="737" rx="10"/>
    <text class="band" x="20" y="1104">CONNECTIONS</text>
    <path class="edge g-wf" d="M150 1101H172"/>
    <text class="lbl" x="180" y="1104">Controller: plan, waves, gates</text>
    <path class="edge g-rf" d="M400 1101H422"/>
    <text class="lbl" x="430" y="1104">Redfish (BMC)</text>
    <path class="edge g-sch" d="M560 1101H582"/>
    <text class="lbl" x="590" y="1104">Scheduler</text>
    <path class="edge g-img" d="M690 1101H712"/>
    <text class="lbl" x="720" y="1104">Image</text>
    <path class="edge g-back" d="M150 1121H172"/>
    <text class="lbl" x="180" y="1124">Failure, hold, way back</text>
    <text class="band" x="20" y="1152">ROLLOUT STAGES</text>
    <g class="badge"><title>Stage 1: Plan and pre-flight</title><circle cx="158" cy="1149" r="8"/><text x="158" y="1152.5" text-anchor="middle">1</text></g>
    <text class="lbl" x="172" y="1152">Plan and pre-flight</text>
    <g class="badge"><title>Stage 2: Drain</title><circle cx="312.38" cy="1149" r="8"/><text x="312.38" y="1152.5" text-anchor="middle">2</text></g>
    <text class="lbl" x="326.38" y="1152">Drain</text>
    <g class="badge"><title>Stage 3: Update</title><circle cx="382.48" cy="1149" r="8"/><text x="382.48" y="1152.5" text-anchor="middle">3</text></g>
    <text class="lbl" x="396.48" y="1152">Update</text>
    <g class="badge"><title>Stage 4: Reset</title><circle cx="458.6" cy="1149" r="8"/><text x="458.6" y="1152.5" text-anchor="middle">4</text></g>
    <text class="lbl" x="472.6" y="1152">Reset</text>
    <g class="badge"><title>Stage 5: Post-check</title><circle cx="528.7" cy="1149" r="8"/><text x="528.7" y="1152.5" text-anchor="middle">5</text></g>
    <text class="lbl" x="542.7" y="1152">Post-check</text>
    <g class="badge"><title>Stage 6: Undrain</title><circle cx="628.9" cy="1149" r="8"/><text x="628.9" y="1152.5" text-anchor="middle">6</text></g>
    <text class="lbl" x="642.9" y="1152">Undrain</text>
  </g>
</svg>
