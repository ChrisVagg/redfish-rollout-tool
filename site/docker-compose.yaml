services:
  # Read metrics using Redfish standard and expose metrics from prometheus agent.
  exporter:
    build: {context: .., dockerfile: site/Dockerfile}
    image: redfish/exporter
    restart: unless-stopped
    network_mode: host  # the BMCs are on the host's addresses
    # --log-state: where each BMC's log reads are, kept across restarts in the log-state volume
    command: [--listen, "127.0.0.1:${EXPORTER_PORT:?}", --interval, "${INTERVAL:?}", --log-state, /state]
    # from make, NETBOX_TOKEN the exporter's own and LOKI, where the BMCs' logs go; a site's BMC accounts from
    # <site>/.env
    environment: [SITE, LAB_USERNAME, LAB_PASSWORD, NETBOX_TOKEN, LOKI]
    env_file: [{path: "../${SITE:?}/.env", required: false}]
    # the repo read-only; the DMTF schemas cache shared with it
    volumes: ["..:/app:ro", "../schemas:/app/schemas", "log-state:/state"]
  
  # Prometheus site agent, which pulls data from the exporter and push them to the control plane prometheus instance.
  prometheus-site-agent:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    network_mode: host
    command: [--agent, --config.file=/etc/prometheus/agent.yml, --storage.agent.path=/prometheus,
              "--web.listen-address=127.0.0.1:${AGENT_PORT:?}"]
    volumes: ["../${SITE}/prometheus-agent.yml:/etc/prometheus/agent.yml:ro", "agent:/prometheus"]
  
  # nginx as http service, working as proxy and caching layer. Read images from filestore system if cache miss.
  image-cache:
    image: nginx:1.27-alpine
    profiles: [cache]
    restart: unless-stopped
    network_mode: host
    volumes: ["image-cache:/var/cache/nginx", "./cache/nginx.conf:/etc/nginx/conf.d/default.conf:ro",
              "../${SITE}/cache/tls.crt:/etc/nginx/tls.crt:ro", "../${SITE}/cache/tls.key:/etc/nginx/tls.key:ro"]
  # Vector, the site's event receiver: each BMC's EventService posts its events to it
  event-receiver:
    image: timberio/vector:0.46.1-alpine
    profiles: [events]
    restart: unless-stopped
    network_mode: host
    command: [--config, /etc/vector/vector.yaml]
    environment: [SITE, LOKI, EVENT_PORT]
    env_file: [{path: .events.env, required: false}]  # EVENT_USERNAME, EVENT_PASSWORD: make makes it
    volumes: ["./vector.yaml:/etc/vector/vector.yaml:ro", "vector:/var/lib/vector"]
volumes:
  agent:
  image-cache:
  log-state:
  vector:
