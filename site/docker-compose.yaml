services:
  # Read metrics using Redfish standard and expose metrics from prometheus agent.
  exporter:
    build: {context: .., dockerfile: site/Dockerfile}
    image: redfish/exporter
    restart: unless-stopped
    network_mode: host  # the BMCs are on the host's addresses
    command: [--listen, "127.0.0.1:${EXPORTER_PORT:?}", --interval, "${INTERVAL:?}"]
    # from make, NETBOX_TOKEN the exporter's own; a site's BMC accounts from <site>/.env
    environment: [SITE, LAB_USERNAME, LAB_PASSWORD, NETBOX_TOKEN]
    env_file: [{path: "../${SITE:?}/.env", required: false}]
    volumes: ["..:/app:ro", "../schemas:/app/schemas"]  # the repo read-only; the DMTF schemas cache shared with it
  
  # Prometheus site agent, which pulls data from the exporter and push them to the control plane prometheus instance.
  prometheus-site-agent:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    network_mode: host
    command: [--agent, --config.file=/etc/prometheus/agent.yml, --storage.agent.path=/prometheus,
              "--web.listen-address=127.0.0.1:${AGENT_PORT:?}"]
    volumes: ["../${SITE}/prometheus-agent.yml:/etc/prometheus/agent.yml:ro", "agent:/prometheus"]
  
  # nginx as http service, working as proxy and caching layer. Read images from filestore system if cache miss.
  image-cache:
    image: nginx:1.27-alpine
    profiles: [cache]
    restart: unless-stopped
    network_mode: host
    volumes: ["image-cache:/var/cache/nginx", "./cache/nginx.conf:/etc/nginx/conf.d/default.conf:ro",
              "../${SITE}/cache/tls.crt:/etc/nginx/tls.crt:ro", "../${SITE}/cache/tls.key:/etc/nginx/tls.key:ro"]
volumes:
  agent:
  image-cache:
