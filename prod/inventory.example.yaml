# Copy to prod/inventory.yaml (git-ignored) and list your BMCs. The credentials come from the environment variables
# named here, which make reads from prod/.env: a ReadOnly account is all the poller and plan need.
defaults: {scheme: https, verify: false}

vendors:
  dell: &dell {username_env: DELL_REDFISH_USERNAME, password_env: DELL_REDFISH_PASSWORD}

servers:
  - {host: 10.0.0.5, vendor: Dell, project: cluster-a, rack: r1, <<: *dell}
  - {host: 10.0.0.6, vendor: Dell, project: cluster-a, rack: r2, <<: *dell}
