# Provision grafana structure
# Lab & Prod folders with each folder fleet, host, inventory dashboard.
apiVersion: 1
providers:
  - {name: lab, folder: Lab, folderUid: lab, type: file, allowUiUpdates: true, options: {path: /etc/grafana/dashboards/lab}}
  - {name: prod, folder: Prod, folderUid: prod, type: file, allowUiUpdates: true, options: {path: /etc/grafana/dashboards/prod}}
