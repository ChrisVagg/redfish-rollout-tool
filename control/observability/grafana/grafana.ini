instance_name = 127.0.0.1

[security]
admin_user = ${GRAFANA_ADMIN_USERNAME}
admin_password = ${GRAFANA_ADMIN_PASSWORD}

[auth.anonymous]
enabled = false

[users]
default_theme=tron

# tables size each column to its content, not an even split (experimental in 13.2)
[feature_toggles]
table.autoColumnWidths = true