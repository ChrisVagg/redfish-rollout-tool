# The control plane's Prometheus. Each site's exporter reaches it through the site's Prometheus agent, which pushes
# (remote write: <site>/prometheus-agent.yml), so it scrapes no site; it scrapes only the Pushgateway, where rollout.py
# run pushes each run's metrics (PUSHGATEWAY)
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: pushgateway
    scrape_interval: 5s
    honor_labels: true  # keep the site, pipeline, stage and host labels the runs pushed
    static_configs: [{targets: ["127.0.0.1:9091"]}]
