# The control plane: what a fleet has one of, every port on 127.0.0.1. The sites connect to it; it never connects to a
# site. make control-up starts it, then runs the ingest, ingest/ (download, signature check, upload into the store),
# when the firmware catalog is missing; the catalog itself, catalog/<site>/, is YAML in git, not a service.
#   netbox, netbox-postgres, netbox-redis   the inventory, http://127.0.0.1:8000
#   state-postgres                          the rollout state, 127.0.0.1:5432
#   store                                   the approved images; each site's cache reads them over S3, :8333
#   pushgateway, prometheus, loki, grafana  observability: the sites' agents push to Prometheus, rollout.py to the
#                                           Pushgateway and Loki; Grafana on http://127.0.0.1:3000
name: redfish-control
x-netbox-secrets: &netbox-secrets
  env_file: netbox/.netbox.env
services:
  # NetBox, the inventory's only source: both sites' hosts, their racks, projects, BMC addresses and how each BMC is
  # reached (config contexts). Its secrets are random, made once by make into control/netbox/.netbox.env: the admin's
  # password is SUPERUSER_PASSWORD there. Each service reads as its own account, which may only view devices, with its
  # read-only API token from control/netbox/.tokens.env, which seed.py gives it
  netbox:
    image: netboxcommunity/netbox:v4.7.2-5.1.1
    env_file: [netbox/.netbox.env, netbox/.tokens.env]  # the tokens for seed.py
    restart: unless-stopped
    depends_on:
      netbox-postgres: {condition: service_healthy}
      netbox-redis: {condition: service_healthy}
    user: "netbox:root"
    ports: ["127.0.0.1:8000:8080"]
    # GRANIAN_EXTRA_ARGS: the web server on IPv4, after the image's --host ::, which fails where Docker has no IPv6
    environment: [DB_HOST=netbox-postgres, DB_NAME=netbox, DB_USER=netbox, REDIS_HOST=netbox-redis,
                  SKIP_SUPERUSER=false, SUPERUSER_NAME=admin, GRANIAN_EXTRA_ARGS=--host=0.0.0.0]
    healthcheck: {test: /opt/netbox/health.sh, start_period: 600s, timeout: 3s, interval: 5s}  # the first start migrates
  netbox-postgres:
    image: postgres:18-alpine
    <<: *netbox-secrets
    restart: unless-stopped
    environment: [POSTGRES_DB=netbox, POSTGRES_USER=netbox]
    healthcheck: {test: pg_isready -q -d netbox -U netbox, start_period: 20s, timeout: 30s, interval: 5s}
    volumes: ["netbox-postgres:/var/lib/postgresql"]
  # NetBox's queue and cache, one Valkey: the cache in its database 1
  netbox-redis:
    image: valkey/valkey:9.1-alpine
    <<: *netbox-secrets
    restart: unless-stopped
    command: [sh, -c, valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"]
    healthcheck: {test: '[ "$$(valkey-cli --pass "$$REDIS_PASSWORD" --no-auth-warning ping)" = PONG ]', interval: 2s}
    volumes: ["netbox-redis:/data"]

  # The rollout state: every event of every run, and a lock per host. schema.sql makes the tables and accounts on the
  # first start; the passwords are random, made once by make into control/state/.state.env. rollout.py connects as
  # redfish_rollout_sa (STATE_DB, which make sets), Grafana as grafana
  state-postgres:
    image: postgres:18-alpine
    env_file: state/.state.env
    restart: unless-stopped
    environment: [POSTGRES_DB=rollout, POSTGRES_USER=rollout]
    ports: ["127.0.0.1:5432:5432"]
    # over TCP, as rollout.py connects: the first start's schema runs on a server that listens on a socket only
    healthcheck: {test: pg_isready -q -h 127.0.0.1 -d rollout -U rollout, start_period: 20s, timeout: 30s, interval: 2s}
    volumes: ["state-postgres:/var/lib/postgresql", "./state/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]

  # The approved store, SeaweedFS: the ingest (make control-up) uploads a package into its bucket firmware only once its
  # signatures verify. It keeps the only copy, and allows anonymous reads only: what each site's image cache fetches
  store:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/access.json]
    ports: ["127.0.0.1:8333:8333"]  # S3, read-only
    volumes: ["store:/data", "./store/access.json:/etc/seaweedfs/access.json:ro"]
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:8888/"]
      interval: 5s
      retries: 30

  # Observability. Prometheus keeps what the sites' Prometheus agents push (remote write) and scrapes the Pushgateway,
  # where rollout.py run pushes each run's metrics; Loki keeps the events rollout.py sends; Grafana reads both and the
  # state database
  pushgateway:
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    network_mode: host
    command: [--web.listen-address=127.0.0.1:9091]
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    network_mode: host
    # the admin API deletes a pipeline's history (LAB.md, Prometheus); the remote-write receiver takes the agents'
    # samples. Both on 127.0.0.1 only
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus,
              --web.listen-address=127.0.0.1:9090, --web.enable-admin-api, --web.enable-remote-write-receiver]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    network_mode: host
    command: [-config.file=/etc/loki/loki.yaml]
    volumes: ["./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki:/loki"]
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    network_mode: host
    env_file: [observability/grafana/.grafana.env]
    environment: [STATE_GRAFANA_PASSWORD]  # the state database's read-only account, from make
    volumes: ["./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro",
              "./observability/grafana/provisioning:/etc/grafana/provisioning:ro",
              "./observability/grafana/dashboards:/etc/grafana/dashboards:ro",
              "grafana:/var/lib/grafana"]
volumes:
  netbox-postgres:
  netbox-redis:
  state-postgres:
  store:
  prometheus:
  loki:
  grafana:
