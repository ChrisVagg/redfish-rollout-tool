# The control plane: what a fleet has one of, every port on 127.0.0.1. The sites connect to it; it never connects to a
# site. make control-up starts it, then runs the ingest, ingest/, when the firmware catalog is missing: the download,
# the sandbox's checks, the upload into the store; the catalog itself, catalog/<site>/, is YAML in git, not a service.
#   netbox, netbox-postgres, netbox-redis   the inventory, http://127.0.0.1:8000
#   state-postgres                          the rollout state, 127.0.0.1:5432
#   store                                   the approved images; each site's cache reads them over S3, :8333
#   sandbox                                 the ingest's checks of each downloaded package, run once per ingest
#   pushgateway, prometheus, loki, grafana  observability: the sites' agents push to Prometheus, rollout.py to the
#                                           Pushgateway and Loki; Grafana on http://127.0.0.1:3000
name: redfish-control
x-netbox-secrets: &netbox-secrets
  env_file: netbox/.netbox.env

services:
  # netbox used as service inventory
  netbox:
    image: netboxcommunity/netbox:v4.7.2-5.1.1
    env_file: [netbox/.netbox.env, netbox/.tokens.env] 
    restart: unless-stopped
    depends_on:
      netbox-postgres: {condition: service_healthy}
      netbox-redis: {condition: service_healthy}
    user: "netbox:root"
    ports: ["127.0.0.1:8000:8080"]
    environment: [DB_HOST=netbox-postgres, DB_NAME=netbox, DB_USER=netbox, REDIS_HOST=netbox-redis,
                  SKIP_SUPERUSER=false, SUPERUSER_NAME=admin, GRANIAN_EXTRA_ARGS=--host=0.0.0.0]
    healthcheck: {test: /opt/netbox/health.sh, start_period: 600s, timeout: 3s, interval: 5s}
  netbox-postgres:
    image: postgres:18-alpine
    <<: *netbox-secrets
    restart: unless-stopped
    environment: [POSTGRES_DB=netbox, POSTGRES_USER=netbox]
    healthcheck: {test: pg_isready -q -d netbox -U netbox, start_period: 20s, timeout: 30s, interval: 5s}
    volumes: ["netbox-postgres:/var/lib/postgresql"]
  # NetBox's queue and cache, one Valkey: the cache in its database 1
  netbox-redis:
    image: valkey/valkey:9.1-alpine
    <<: *netbox-secrets
    restart: unless-stopped
    command: [sh, -c, valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"]
    healthcheck: {test: '[ "$$(valkey-cli --pass "$$REDIS_PASSWORD" --no-auth-warning ping)" = PONG ]', interval: 2s}
    volumes: ["netbox-redis:/data"]

  # DB to store the rollout state, events and locks per host in the pipelines.
  state-postgres:
    image: postgres:18-alpine
    env_file: state/.state.env
    restart: unless-stopped
    environment: [POSTGRES_DB=rollout, POSTGRES_USER=rollout]
    ports: ["127.0.0.1:5432:5432"]
    # over TCP, as rollout.py connects: the first start's schema runs on a server that listens on a socket only
    healthcheck: {test: pg_isready -q -h 127.0.0.1 -d rollout -U rollout, start_period: 20s, timeout: 30s, interval: 2s}
    volumes: ["state-postgres:/var/lib/postgresql", "./state/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]

  # The ingest's sandbox, between the download and the upload: verify-fw-package.sh checks each downloaded package's
  # files, signatures and machine, and prints only what passed. It reads untrusted packages, so it gets nothing else: no
  # network, a read-only root, as nobody, no capabilities, its scratch space in memory, ingest/ read-only. It can't
  # reach the store: promote-store-fw-package.sh uploads what it listed. Never started by up: make control-up runs it
  sandbox:
    build:
      context: ingest
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache bash openssl tar
    profiles: [ingest]
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 512m
    pids_limit: 64
    volumes: ["./ingest:/ingest:ro"]
    command: [bash, -c, "/ingest/verify-fw-package.sh /ingest/staging/*.tar"]

  # The approved store, SeaweedFS: the ingest (make control-up) uploads a package into its bucket firmware only once the
  # sandbox verified it. It keeps the only copy, and allows anonymous reads only: what each site's image cache fetches
  store:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/access.json]
    ports: ["127.0.0.1:8333:8333"]  # S3, WORM
    volumes: ["store:/data", "./store/access.json:/etc/seaweedfs/access.json:ro"]
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:8888/"]
      interval: 5s
      retries: 2

  # rollout.py run pushes each run's metrics to pushgateway service and prometheus pulls them.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    network_mode: host
    command: [--web.listen-address=127.0.0.1:9091]
  # rollout.py pushes events to loki.
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    network_mode: host
    command: [-config.file=/etc/loki/loki.yaml]
    volumes: ["./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki:/loki"]
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    network_mode: host
    # the admin API deletes a pipeline's history (README.md, Observability); the remote-write receiver takes the agents'
    # samples. Both on 127.0.0.1 only. Samples are kept 30 days, as Loki keeps its events
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus,
              --storage.tsdb.retention.time=30d,
              --web.listen-address=127.0.0.1:9090, --web.enable-admin-api, --web.enable-remote-write-receiver]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
  
  # Data sources: Prometheus, loki, postgresDB
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    network_mode: host
    env_file: [observability/grafana/.grafana.env]
    environment: [STATE_GRAFANA_PASSWORD]  # the state database's read-only account, from make
    volumes: ["./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro",
              "./observability/grafana/provisioning:/etc/grafana/provisioning:ro",
              "./observability/grafana/dashboards:/etc/grafana/dashboards:ro",
              "grafana:/var/lib/grafana",
              # docs/'s diagrams for the Architecture dashboards, and docs/incidents/ for the Reports' images (kept out
              # of git, the folder empty in a clone): Grafana serves public/ without a login, so these only, not docs/
              "../docs/lab-stack.svg:/usr/share/grafana/public/docs/lab-stack.svg:ro",
              "../docs/lab-rollout.svg:/usr/share/grafana/public/docs/lab-rollout.svg:ro",
              "../docs/lab-solution-architecture.svg:/usr/share/grafana/public/docs/lab-solution-architecture.svg:ro",
              "../docs/prod-stack.svg:/usr/share/grafana/public/docs/prod-stack.svg:ro",
              "../docs/prod-rollout.svg:/usr/share/grafana/public/docs/prod-rollout.svg:ro",
              "../docs/prod-solution-architecture.svg:/usr/share/grafana/public/docs/prod-solution-architecture.svg:ro",
              "../docs/incidents:/usr/share/grafana/public/docs/incidents:ro"]
volumes:
  netbox-postgres:
  netbox-redis:
  state-postgres:
  store:
  prometheus:
  loki:
  grafana:
